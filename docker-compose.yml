version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:63900}
    container_name: centropy-admin-frontend
    ports:
      - "${PORT:-8090}:80"
    restart: unless-stopped
    networks:
      - centropy-network
      - panel-network
      - external-network

networks:
  centropy-network:
    driver: bridge
  panel-network:
    driver: bridge
  external-network:
    external: true

