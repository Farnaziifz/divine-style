services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:63900}
    container_name: d-style-site
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - dstyle-network
      - panel-network
      - external-network

networks:
  dstyle-network:
    driver: bridge
  panel-network:
    driver: bridge
  external-network:
    driver: bridge
    name: ${EXTERNAL_NETWORK:-external-network}
