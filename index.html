<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divine | Vintage Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Inter:wght@300;400;500&family=Vazirmatn:wght@300;400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'zafting-bg': '#E8E0D9', // Matches the beige/cream from the image
              'zafting-text': '#2A2A2A',
              'zafting-accent': '#6B5B54',
            },
            fontFamily: {
              serif: ['"Playfair Display"', '"Noto Naskh Arabic"', 'serif'],
              sans: ['"Inter"', '"Vazirmatn"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #E8E0D9;
        color: #2A2A2A;
      }
      /* Custom utility for the outline text effect seen in the image */
      .text-outline {
        -webkit-text-stroke: 1px #2A2A2A;
        color: transparent;
      }
      /* Noise texture overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
